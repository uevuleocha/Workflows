interface:
  display_name: "Antigravity Workspace Chat Migration"
  short_description: "Safely migrate Antigravity chats between workspaces."
  default_prompt: "Use this skill to migrate selected Antigravity Desktop conversations from one workspace/project to another by reassigning the conversation blob's Project UUID (protobuf Field 18 — real UUID parsing with hard-fail on missing/invalid, graceful stop on a missing blob row) and rewriting the workspace URI only at enumerated permitted field paths (ambiguous or out-of-scope matches hard-stop), verifying the persisted Field 18 value, hard-stopping before apply unless all destination resources verify, and keeping the cascade-map single-ID, with backups and verification. Antigravity must be fully closed for the execution side. Arbitrary whole-app-data replacement is explicitly prohibited."
