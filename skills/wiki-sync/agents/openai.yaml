interface:
  display_name: "Wiki Sync"
  short_description: "Safely sync a schema-driven workspace wiki"
  default_prompt: "Use $wiki-sync to sync the current workspace's schema-declared sources. Confirm manifest, order, and batching. Detect and name mostly historical groups, then use mine-and-fold plus light history only with user approval. Obey one-shot instructions, never mutate sources or cross nested workspaces, and verify each pass."

policy:
  allow_implicit_invocation: true
