interface:
  display_name: "Delegate This"
  short_description: "Route work across agents and platforms"
  default_prompt: "Use $delegate-this to divide a substantial objective across multiple agents. Mode A writes a durable cross-platform delegation record with one self-contained packet per authorized platform, and always requires a parent plan and/or task. Mode B coordinates native subagents directly: it is parent-optional and creates no durable delegation record merely for dispatch."

policy:
  allow_implicit_invocation: true
